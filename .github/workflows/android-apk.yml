name: Android APK

# Builds an installable debug APK and publishes it as the "android-dev" pre-release, so the
# latest build can be downloaded straight to a phone from the repository's Releases page.
#
# Every build is signed with the same key (repository secrets ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEYSTORE_PASSWORD, alias "fpscad"), and its version code is the workflow's run number,
# so a new build installs over the old one as an update. The release also carries latest.json,
# which the app reads to offer updates (godot/scripts/updater.gd).

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  OCCT_TAG: V8_0_1
  GODOT_VERSION: 4.7.2

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache Open CASCADE (Android)
        id: occt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/occt-android
          key: occt-${{ env.OCCT_TAG }}-android-arm64-v1

      - name: Build Open CASCADE
        if: steps.occt.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" tools/ci_run.sh tools/build_occt.sh "${{ runner.temp }}/occt-android" android

      - name: Build the extension for Android
        run: |
          tools/ci_run.sh cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_shared \
            -DCMAKE_FIND_ROOT_PATH="${{ runner.temp }}/occt-android" \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/occt-android" \
            -DFPCAD_BUILD_TESTS=OFF -DFPCAD_BUILD_CLI=OFF \
            -DFPCAD_BUILD_EXTENSION=ON -DGODOTCPP_TARGET=template_debug
          tools/ci_run.sh cmake --build build -j

      - name: Stage Open CASCADE and libc++ beside the extension
        run: |
          LIBCXX=$(find "$ANDROID_NDK_LATEST_HOME" -path "*aarch64-linux-android/libc++_shared.so" | head -1)
          python3 tools/stage_occt.py --occt "${{ runner.temp }}/occt-android" --platform android --extra "$LIBCXX"
          ls -la godot/bin

      - name: Install Godot and its export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          unzip -q -j templates.tpz "templates/android_*" "templates/version.txt" -d "$DEST"
          ls "$DEST"

      - name: Configure Android SDK, Java and a debug keystore
        run: |
          KEYSTORE="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          MAJOR_MINOR=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${MAJOR_MINOR}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_21_X64"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          # apksigner from recent build-tools needs a current JDK on PATH.
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Signing key and build number
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGN_KS=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGN_ALIAS=fpscad" >> "$GITHUB_ENV"
            echo "SIGN_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "SIGN_KIND=release" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set: signing with a throwaway debug key, so this build cannot update an installed one."
            echo "SIGN_KS=$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" >> "$GITHUB_ENV"
            echo "SIGN_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "SIGN_PASS=android" >> "$GITHUB_ENV"
            echo "SIGN_KIND=debug" >> "$GITHUB_ENV"
          fi
          BUILD=${{ github.run_number }}
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          # Android installs a build over another only when its version code is not lower.
          sed -i "s|^version/code=.*|version/code=$BUILD|; s|^version/name=.*|version/name=\"0.2.$BUILD\"|" godot/export_presets.cfg
          cat > godot/scripts/build_info.gd <<EOF
          extends RefCounted
          ## Written by CI for each published build.
          const BUILD := $BUILD
          const COMMIT := "${GITHUB_SHA::7}"
          const BRANCH := "${GITHUB_REF_NAME}"
          const VERSION := "0.2.$BUILD"
          EOF
          sed -i 's/^          //' godot/scripts/build_info.gd
          cat godot/scripts/build_info.gd
          grep -E "^version/" godot/export_presets.cfg

      - name: Export the APK
        run: |
          GODOT=./Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p export/android
          timeout 300 $GODOT --headless --path godot --import || true
          # Export unsigned, then align and sign with the SDK tools so any signing error is visible.
          sed -i 's|^package/signed=.*||; s|^\[preset.1.options\]$|[preset.1.options]\npackage/signed=false|' godot/export_presets.cfg
          java -version
          ls "$ANDROID_SDK_ROOT/build-tools"
          tools/ci_run.sh timeout 600 $GODOT --headless --verbose --path godot --export-debug "Android" "$PWD/export/android/FPS-CAD.apk"
          test -s export/android/FPS-CAD.apk
          BT="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          python3 tools/dedupe_apk.py export/android/FPS-CAD.apk export/android/deduped.apk
          tools/ci_run.sh "$BT/zipalign" -f -p 4 export/android/deduped.apk export/android/aligned.apk
          tools/ci_run.sh "$BT/apksigner" sign --ks "$SIGN_KS" --ks-pass env:SIGN_PASS \
            --ks-key-alias "$SIGN_ALIAS" --key-pass env:SIGN_PASS --out export/android/FPS-CAD.apk export/android/aligned.apk
          tools/ci_run.sh "$BT/apksigner" verify --print-certs export/android/FPS-CAD.apk | tee export/android/certs.txt
          echo "CERT_SHA256=$(grep -m1 'SHA-256 digest' export/android/certs.txt | awk '{print $NF}')" >> "$GITHUB_ENV"
          unzip -l export/android/FPS-CAD.apk | grep -E "lib/arm64-v8a/.*\.so" | tee export/android/libs.txt
          grep -q libfpcad export/android/libs.txt || { echo "::error::the APK is missing the CAD extension"; exit 1; }
          cp export/android/FPS-CAD.apk "export/android/FPS-CAD-${GITHUB_SHA::7}.apk"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/android-dev/FPS-CAD-${GITHUB_SHA::7}.apk"
          python3 - "$APK_URL" > export/android/latest.json <<'PY'
          import json, os, sys
          print(json.dumps({"build": int(os.environ["BUILD"]), "version": "0.2." + os.environ["BUILD"],
                            "commit": os.environ["GITHUB_SHA"][:7], "branch": os.environ["GITHUB_REF_NAME"],
                            "signing": os.environ["SIGN_KIND"], "apk": sys.argv[1]}, indent=2))
          PY
          cat export/android/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: fps-cad-android-apk
          path: export/android/FPS-CAD.apk

      - name: Publish the android-dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-dev --cleanup-tag --yes || true
          if [ "$SIGN_KIND" = release ]; then
            SIGN_NOTE="Signed with the FPS-CAD key (certificate SHA-256 \`$CERT_SHA256\`): it installs over any earlier build signed with the same key as an update, keeping your files. The app checks for newer builds on launch."
          else
            SIGN_NOTE="Signed with a throwaway debug key because the signing secrets are not set, so uninstall any other build first."
          fi
          gh release create android-dev "export/android/FPS-CAD-${GITHUB_SHA::7}.apk" export/android/latest.json \
            --prerelease --target "$GITHUB_SHA" \
            --title "Android build ${BUILD} (${GITHUB_SHA::7})" \
            --notes "Build ${BUILD} (version 0.2.${BUILD}) of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}, for testing on a phone.

          Install: open this page on the phone, download the APK, and allow installs from your browser when Android asks. Android 10 or newer, 64-bit (arm64). Pair an Xbox controller over Bluetooth first, or use the on-screen controls.

          $SIGN_NOTE"
